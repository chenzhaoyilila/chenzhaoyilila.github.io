<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title data-en="Project Two · Zhaoyi Chen" data-zh="项目二 · Zhaoyi Chen">Project Two · Zhaoyi Chen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --text-dark: #333;
      --text-muted: #888;
      --text-light: #aaa;
      --bg: #f8f8f8;
      --border-subtle: rgba(0, 0, 0, 0.06);
    }
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      color: var(--text-dark);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 1rem;
      outline: none;
      background: transparent;
    }
    .logo:focus, .logo:focus-visible { outline: none; box-shadow: none; }
    .logo-mark {
      width: 32px;
      height: 32px;
      position: relative;
      display: inline-block;
    }
    .logo-mark .circle-fill,
    .logo-mark .circle-outline {
      position: absolute;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 10px;
      margin-left: -10px;
      margin-top: -5px;
      transform-origin: center center;
    }
    .logo-mark .circle-fill {
      background: linear-gradient(135deg, #1a1a1a 0%, #555 100%);
      animation: logoEllipse1 10s linear infinite;
    }
    .logo-mark .circle-outline {
      background: linear-gradient(315deg, #888 0%, #1a1a1a 100%);
      opacity: 0.95;
      animation: logoEllipse2 10s linear infinite;
    }
    @keyframes logoEllipse1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes logoEllipse2 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .lang-toggle {
      display: inline-flex;
      align-items: center;
      padding: 0;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: transparent;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      overflow: hidden;
    }
    .lang-toggle .lang-opt {
      padding: 0.3rem 0.6rem;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .lang-toggle .lang-opt.is-active {
      background: var(--text-dark);
      color: #fff;
    }
    main {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 2rem;
      width: 100%;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 3rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text-dark); }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .meta { font-size: 0.85rem; color: var(--text-light); margin-bottom: 2rem; }
    .project-content p { color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.75; }
    .tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 2rem; }
    .tag { font-size: 0.75rem; color: var(--text-light); }
    /* Transition overlay */
    .transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .transition-overlay.active { opacity: 1; visibility: visible; }
    .transition-overlay.out { opacity: 0; visibility: hidden; }
    .transition-overlay .loader-mark { width: 40px; height: 40px; position: relative; }
    .transition-overlay .loader-mark .circle-fill,
    .transition-overlay .loader-mark .circle-outline {
      position: absolute;
      border-radius: 50%;
    }
    .transition-overlay .loader-mark .circle-fill {
      width: 24px;
      height: 24px;
      background: var(--text-dark);
      top: 0;
      left: 0;
      animation: loaderPulse 0.8s ease-in-out infinite;
    }
    .transition-overlay .loader-mark .circle-outline {
      width: 24px;
      height: 24px;
      border: 2px solid var(--text-dark);
      top: 10px;
      left: 10px;
      opacity: 0.4;
    }
    @keyframes loaderPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.92); opacity: 0.7; }
    }
    .transition-overlay .loader-line {
      width: 120px;
      height: 2px;
      background: var(--border-subtle);
      border-radius: 1px;
      overflow: hidden;
    }
    .transition-overlay .loader-line-inner {
      height: 100%;
      width: 0;
      background: var(--text-dark);
      border-radius: 1px;
      animation: loaderLine 1s ease-in-out infinite;
    }
    @keyframes loaderLine {
      0% { width: 0; margin-left: 0; }
      50% { width: 40%; margin-left: 30%; }
      100% { width: 0; margin-left: 100%; }
    }
    .transition-overlay .loader-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-light);
    }
    @media (max-width: 768px) {
      header { padding: 1.25rem 1.5rem; }
      main { padding: 3rem 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-mark .circle-fill,
      .logo-mark .circle-outline { animation: none; }
      .logo-mark .circle-fill { transform: rotate(-20deg); }
      .logo-mark .circle-outline { transform: rotate(20deg); }
      .transition-overlay .loader-mark .circle-fill { animation: none; }
      .transition-overlay .loader-line-inner { animation: none; width: 60%; margin-left: 20%; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo js-transition" data-transition="page">
      <span class="logo-mark">
        <span class="circle-fill"></span>
        <span class="circle-outline"></span>
      </span>
      <span>ZC</span>
    </a>
    <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language / 切换语言">
      <span class="lang-opt" data-lang="zh">中</span>
      <span class="lang-opt" data-lang="en">EN</span>
    </button>
  </header>

  <main>
    <a href="index.html#projects" class="back-link js-transition" data-transition="page" data-en="← Back to projects" data-zh="← 返回项目">← Back to projects</a>
    <h1 data-en="Project Two" data-zh="项目二">Project Two</h1>
    <p class="meta">Vue.js · Python · PostgreSQL</p>
    <div class="project-content">
      <p data-en="Another project that shows your skills and how you approach problems. Expand with details, challenges, and outcomes." data-zh="另一个项目，展示你的技能与解决问题的方式。可在此补充细节、遇到的挑战与最终成果。">Another project that shows your skills and how you approach problems. Expand with details, challenges, and outcomes.</p>
      <p data-en="You can add technical details, links to demos or code, and reflections here." data-zh="你可以在此加入技术细节、演示或代码链接，以及个人的思考与总结。">You can add technical details, links to demos or code, and reflections here.</p>
    </div>
    <div class="tags">
      <span class="tag">Vue.js</span>
      <span class="tag">Python</span>
      <span class="tag">PostgreSQL</span>
    </div>
  </main>

  <div id="transition-overlay" class="transition-overlay" aria-hidden="true">
    <div class="loader-mark">
      <span class="circle-fill"></span>
      <span class="circle-outline"></span>
    </div>
    <div class="loader-line">
      <div class="loader-line-inner"></div>
    </div>
    <span class="loader-label" data-en="Loading" data-zh="加载中">Loading</span>
  </div>

  <script>
    /* ---- Language toggle: swap every [data-en]/[data-zh] node ---- */
    (function i18nToggle() {
      function detect() {
        var stored = null;
        try { stored = localStorage.getItem('lang'); } catch (e) {}
        if (stored === 'zh' || stored === 'en') return stored;
        return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
      }
      function apply(l) {
        window.__lang = l;
        document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-en]').forEach(function (el) {
          var v = el.getAttribute(l === 'zh' ? 'data-zh' : 'data-en');
          if (v != null) el.textContent = v;
        });
        document.querySelectorAll('.lang-toggle .lang-opt').forEach(function (o) {
          o.classList.toggle('is-active', o.getAttribute('data-lang') === l);
        });
        try { localStorage.setItem('lang', l); } catch (e) {}
      }
      var toggle = document.getElementById('lang-toggle');
      if (toggle) {
        toggle.addEventListener('click', function (e) {
          var opt = e.target.closest('.lang-opt');
          var next = opt ? opt.getAttribute('data-lang') : (window.__lang === 'zh' ? 'en' : 'zh');
          apply(next);
        });
      }
      apply(detect());
    })();

    /* ---- Page transition overlay ---- */
    (function () {
      var OVERLAY_DURATION = 1200;
      var overlay = document.getElementById('transition-overlay');
      function showOverlay() {
        if (!overlay) return;
        overlay.setAttribute('aria-hidden', 'false');
        overlay.classList.remove('out');
        overlay.classList.add('active');
      }
      document.querySelectorAll('.js-transition').forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          var target = link.getAttribute('data-target') || link.getAttribute('href');
          if (link.getAttribute('data-transition') === 'page' && target) {
            showOverlay();
            setTimeout(function () { window.location.href = target; }, OVERLAY_DURATION);
          }
        });
      });
    })();
  </script>
</body>
</html>
