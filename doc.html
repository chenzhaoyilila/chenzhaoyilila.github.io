<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title data-en="Document · Zhaoyi Chen" data-zh="文档 · Zhaoyi Chen">Document · Zhaoyi Chen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --text-dark: #333;
      --text-muted: #888;
      --text-light: #aaa;
      --bg: #f8f8f8;
      --border-subtle: rgba(0, 0, 0, 0.06);
    }
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      color: var(--text-dark);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 1rem;
      outline: none;
      background: transparent;
    }
    .logo:focus, .logo:focus-visible { outline: none; box-shadow: none; }
    .logo-mark {
      width: 32px;
      height: 32px;
      position: relative;
      display: inline-block;
    }
    .logo-mark .circle-fill,
    .logo-mark .circle-outline {
      position: absolute;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 10px;
      margin-left: -10px;
      margin-top: -5px;
      transform-origin: center center;
    }
    .logo-mark .circle-fill {
      background: linear-gradient(135deg, #1a1a1a 0%, #555 100%);
      animation: logoEllipse1 10s linear infinite;
    }
    .logo-mark .circle-outline {
      background: linear-gradient(315deg, #888 0%, #1a1a1a 100%);
      opacity: 0.95;
      animation: logoEllipse2 10s linear infinite;
    }
    @keyframes logoEllipse1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes logoEllipse2 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .btn {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid var(--text-dark);
      color: var(--text-dark);
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.2s ease;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .lang-toggle {
      display: inline-flex;
      align-items: center;
      padding: 0;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: transparent;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      overflow: hidden;
    }
    .lang-toggle .lang-opt {
      padding: 0.3rem 0.6rem;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .lang-toggle .lang-opt.is-active {
      background: var(--text-dark);
      color: #fff;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    main {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 2.5rem 4rem;
      width: 100%;
    }
    .meta {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      margin-bottom: 0.75rem;
      line-height: 1.25;
    }
    .prose { font-size: 1rem; color: #555; line-height: 1.8; }
    .prose > :first-child { margin-top: 0; }
    .prose p { margin-bottom: 1rem; }
    .prose h1, .prose h2, .prose h3, .prose h4 {
      color: var(--text-dark);
      font-weight: 600;
      line-height: 1.35;
      margin: 2.25rem 0 0.75rem;
    }
    .prose h1 { font-size: 1.5rem; }
    .prose h2 { font-size: 1.3rem; }
    .prose h3 { font-size: 1.1rem; }
    .prose h4 { font-size: 1rem; }
    .prose a { color: var(--text-dark); text-underline-offset: 3px; }
    .prose strong { color: var(--text-dark); }
    .prose ul, .prose ol { margin: 1rem 0 1rem 1.25rem; }
    .prose li { margin-bottom: 0.35rem; }
    .prose blockquote {
      margin: 1.5rem 0;
      padding-left: 1rem;
      border-left: 2px solid #ddd;
      color: var(--text-muted);
    }
    .prose blockquote p { margin: 0; }
    .prose code {
      font-size: 0.9em;
      background: rgba(0, 0, 0, 0.06);
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }
    .prose pre {
      margin: 1.5rem 0;
      padding: 1rem 1.25rem;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .prose pre code { background: none; padding: 0; font-size: inherit; }
    .prose hr { border: 0; border-top: 1px solid #e5e5e5; margin: 2.25rem 0; }
    .prose img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 1.5rem 0;
      border: 1px solid var(--border-subtle);
    }
    .doc-date { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2.5rem; }
    .doc-source {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e5e5e5;
      font-size: 0.85rem;
    }
    .doc-source a { color: var(--text-muted); text-decoration: none; }
    .doc-source a:hover { color: var(--text-dark); }
    .doc-status { color: var(--text-muted); }
    .transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .transition-overlay.active { opacity: 1; visibility: visible; }
    .transition-overlay.out { opacity: 0; visibility: hidden; }
    .transition-overlay .loader-mark { width: 40px; height: 40px; position: relative; }
    .transition-overlay .loader-mark .circle-fill,
    .transition-overlay .loader-mark .circle-outline {
      position: absolute;
      border-radius: 50%;
    }
    .transition-overlay .loader-mark .circle-fill {
      width: 24px;
      height: 24px;
      background: var(--text-dark);
      top: 0;
      left: 0;
      animation: loaderPulse 0.8s ease-in-out infinite;
    }
    .transition-overlay .loader-mark .circle-outline {
      width: 24px;
      height: 24px;
      border: 2px solid var(--text-dark);
      top: 10px;
      left: 10px;
      opacity: 0.4;
    }
    @keyframes loaderPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.92); opacity: 0.7; }
    }
    .transition-overlay .loader-line {
      width: 120px;
      height: 2px;
      background: var(--border-subtle);
      border-radius: 1px;
      overflow: hidden;
    }
    .transition-overlay .loader-line-inner {
      height: 100%;
      width: 0;
      background: var(--text-dark);
      border-radius: 1px;
      animation: loaderLine 1s ease-in-out infinite;
    }
    @keyframes loaderLine {
      0% { width: 0; margin-left: 0; }
      50% { width: 40%; margin-left: 30%; }
      100% { width: 0; margin-left: 100%; }
    }
    .transition-overlay .loader-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-light);
    }
    @media (max-width: 768px) {
      header { padding: 1.25rem 1.5rem; }
      main { padding: 2.5rem 1.5rem 3rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-mark .circle-fill,
      .logo-mark .circle-outline { animation: none; }
      .logo-mark .circle-fill { transform: rotate(-20deg); }
      .logo-mark .circle-outline { transform: rotate(20deg); }
      .transition-overlay .loader-mark .circle-fill { animation: none; }
      .transition-overlay .loader-line-inner { animation: none; width: 60%; margin-left: 20%; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo js-transition" data-transition="page">
      <span class="logo-mark">
        <span class="circle-fill"></span>
        <span class="circle-outline"></span>
      </span>
      <span>ZC</span>
    </a>
    <div class="header-actions">
      <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language / 切换语言">
        <span class="lang-opt" data-lang="zh">中</span>
        <span class="lang-opt" data-lang="en">EN</span>
      </button>
      <a href="files.html" class="btn js-transition" data-transition="page" data-en="← Files" data-zh="← 资料">← Files</a>
    </div>
  </header>

  <main id="doc-main">
    <p class="doc-status" data-en="Loading…" data-zh="正在加载…">Loading…</p>
  </main>

  <div id="transition-overlay" class="transition-overlay" aria-hidden="true">
    <div class="loader-mark">
      <span class="circle-fill"></span>
      <span class="circle-outline"></span>
    </div>
    <div class="loader-line">
      <div class="loader-line-inner"></div>
    </div>
    <span class="loader-label" data-en="Loading" data-zh="加载中">Loading</span>
  </div>

  <script>
    var I18N = {
      source: { en: 'View the original .md file', zh: '查看原始 .md 文件' },
      noId: {
        en: 'No document selected. Go back to <a href="files.html">files</a>.',
        zh: '未选择文档。返回<a href="files.html">资料</a>。'
      },
      notFound: {
        en: 'This document was not found. It may have been renamed or removed.',
        zh: '未找到该文档，它可能已被改名或删除。'
      },
      loadError: {
        en: 'Could not load content/files.json. Run python3 build_files.py and open the site through a local server.',
        zh: '无法加载 content/files.json。请先运行 python3 build_files.py，并通过本地服务器打开。'
      }
    };
    function lang() { return window.__lang === 'zh' ? 'zh' : 'en'; }
    function t(key) { var e = I18N[key]; return e ? e[lang()] : ''; }
    function escapeHtml(s) {
      var div = document.createElement('div');
      div.textContent = s == null ? '' : String(s);
      return div.innerHTML;
    }
    // Encode each path segment so spaces, CJK, '#' and '?' in filenames survive.
    function fileUrl(path) {
      return String(path).split('/').map(encodeURIComponent).join('/');
    }

    /* ---- Language toggle: swap every [data-en]/[data-zh] node ---- */
    (function i18nToggle() {
      function detect() {
        var stored = null;
        try { stored = localStorage.getItem('lang'); } catch (e) {}
        if (stored === 'zh' || stored === 'en') return stored;
        return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
      }
      function apply(l) {
        window.__lang = l;
        document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-en]').forEach(function (el) {
          var v = el.getAttribute(l === 'zh' ? 'data-zh' : 'data-en');
          if (v != null) el.textContent = v;
        });
        document.querySelectorAll('.lang-toggle .lang-opt').forEach(function (o) {
          o.classList.toggle('is-active', o.getAttribute('data-lang') === l);
        });
        try { localStorage.setItem('lang', l); } catch (e) {}
        document.dispatchEvent(new CustomEvent('langchange', { detail: { lang: l } }));
      }
      var toggle = document.getElementById('lang-toggle');
      if (toggle) {
        toggle.addEventListener('click', function (e) {
          var opt = e.target.closest('.lang-opt');
          apply(opt ? opt.getAttribute('data-lang') : (window.__lang === 'zh' ? 'en' : 'zh'));
        });
      }
      apply(detect());
    })();

    /* ---- Page transition, delegated so rendered links get it too ---- */
    document.body.addEventListener('click', function (e) {
      var link = e.target.closest('a.js-transition');
      if (!link || link.getAttribute('data-transition') !== 'page') return;
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      var overlay = document.getElementById('transition-overlay');
      if (overlay) {
        overlay.setAttribute('aria-hidden', 'false');
        overlay.classList.add('active');
        var lbl = overlay.querySelector('.loader-label');
        if (lbl) lbl.textContent = lang() === 'zh' ? '加载中' : 'Loading';
      }
      var href = link.getAttribute('href');
      setTimeout(function () { window.location.href = href; }, 1200);
    });

    /* ---- Render one Markdown note from content/files.json ---- */
    (function doc() {
      var id = new URLSearchParams(window.location.search).get('id');
      var main = document.getElementById('doc-main');
      var state = id ? 'loading' : 'no-id';
      var current = null;

      function render() {
        if (state === 'no-id') { main.innerHTML = '<p class="doc-status">' + t('noId') + '</p>'; return; }
        if (state === 'not-found') { main.innerHTML = '<p class="doc-status">' + t('notFound') + '</p>'; return; }
        if (state === 'error') { main.innerHTML = '<p class="doc-status">' + t('loadError') + '</p>'; return; }
        if (state !== 'loaded') return;
        document.title = current.title + ' · Zhaoyi Chen';
        main.innerHTML =
          '<p class="meta">Markdown</p>' +
          '<h1>' + escapeHtml(current.title) + '</h1>' +
          '<p class="doc-date">' + escapeHtml(current.date) + '</p>' +
          '<div class="prose">' + (current.html || '') + '</div>' +
          '<p class="doc-source"><a href="' + fileUrl(current.path) + '" target="_blank" rel="noopener">' +
          t('source') + ' →</a></p>';
      }

      document.addEventListener('langchange', render);
      if (!id) { render(); return; }

      fetch('content/files.json', { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          current = (d.markdown || []).filter(function (x) { return x.id === id; })[0] || null;
          state = current ? 'loaded' : 'not-found';
          render();
        })
        .catch(function () { state = 'error'; render(); });
    })();
  </script>
  <script src="assets/interactions.js" defer></script>
</body>
</html>
